# Serves the everydashcam build (see Dockerfile). Doubles as the reference for
# any other static server: site root, directory index, extension-less
# rewrites, isolation headers, fresh /sw.js, immutable hashed assets
# (docs/self-hosting.md).
server {
    listen 80;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cross-origin isolation, as in public/_headers. A location with its own
    # add_header drops these, so such locations repeat them. An isolated page
    # refuses a worker script from /assets/ that arrives without COEP.
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "require-corp";

    # The browser's service-worker update check must see a fresh file, or a
    # new deployment is slow to reach returning visitors.
    location = /sw.js {
        add_header Cache-Control "max-age=0, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
    }

    # Hashed filenames - content never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
    }

    # nginx's stock mime.types may not know .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Extension-less internal links (/privacy -> privacy.html) and the
    # /<lang>/ directory indexes.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
