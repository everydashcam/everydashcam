name: Fork Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fork-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'OpenPeanut/dashcamigo'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build Pages artifact
        run: |
          npm run build:portable -- --locale zh
          mkdir -p pages
          cp dist-portable/dashcamigo-*-zh.html pages/index.html
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v5
