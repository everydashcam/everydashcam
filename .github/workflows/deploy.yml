# Staging deploy: every push to `main` builds with the staging env and uploads
# dist/ to the Cloudflare Pages project as a deployment of the `main` branch.
# beta.everydashcam.app is a CNAME to that branch alias
# (main.<project>.pages.dev; docs/deploy.md, "Staging domain").
#
# The build runs here, not in Cloudflare: the Pages project's git integration
# is unused (Pages cannot re-link a project to another repository -
# docs/deploy.md, "Deployment pipeline"); wrangler deploys by project name
# over the API, no git binding involved. --commit-hash ties the deployment
# record to the commit for the dashboard and API consumers; --branch selects
# the alias (a non-production branch name = a preview deployment).
#
# Forks: without the CF secrets the run self-skips and stays green (same
# contract as the INDEXNOW_KEY gate in indexnow.yml).

name: Deploy staging

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Rapid successive pushes: only the newest tree is worth deploying - a
# superseded run wastes minutes and could land its deployment out of order.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configuration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      # Gate first, before checkout, so a fork's skip costs seconds.
      - name: Check Cloudflare secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - staging deploy is off for this repo, skipping"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  portable:
    needs: configuration
    if: needs.configuration.outputs.deploy == 'true'
    uses: ./.github/workflows/portable.yml
    with:
      version: dev-${{ github.sha }}
      allow-development: true
    secrets:
      yandex-key: ${{ secrets.VITE_YANDEX_TILES_API_KEY_STAGING }}

  deploy:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: sitemap <lastmod> derives from git mtime
          # (vite-plugins/git-mtime.ts); a shallow clone would drop it.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: portable-html
          path: dist-portable

      - name: Build (staging env)
        env:
          PORTABLE_MANIFEST: ${{ github.workspace }}/dist-portable/manifest.json
          PORTABLE_ALLOW_DEV: "1"
          # Staging must never be indexed (vite.config.ts gates noindex +
          # robots.txt on this). Staging reports to its own Sentry project
          # (separate DSN + slug), so beta noise never lands among production
          # issues. No INDEXNOW_KEY: the key file is a production concern.
          VITE_NO_INDEX: "1"
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN_STAGING }}
          VITE_YANDEX_TILES_API_KEY: ${{ secrets.VITE_YANDEX_TILES_API_KEY_STAGING }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_STAGING }}
        run: npm run build

      # Keep sentry-cli outside Vite: Sentry API outages have previously left
      # the plugin's writeBundle hook waiting until the whole deploy timed out.
      # Source maps improve diagnostics but must never block a site deploy.
      - name: Upload source maps to Sentry
        continue-on-error: true
        timeout-minutes: 2
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_STAGING }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ] || [ -z "${SENTRY_ORG}" ] || [ -z "${SENTRY_PROJECT}" ]; then
            echo "::notice::Sentry source-map upload is not configured, skipping"
            exit 0
          fi
          release="$(git describe --tags --exact-match HEAD 2>/dev/null || git rev-parse --short HEAD)"
          npx --no-install sentry-cli sourcemaps upload --release="${release}" dist

      - name: Retain the previous deployment's immutable assets
        run: node --experimental-strip-types scripts/retain-deployment-assets.mts dist https://beta.everydashcam.app

      - name: Save the final hosted dist for recovery
        uses: actions/upload-artifact@v7
        with:
          name: hosted-dist-beta-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Deploy to Cloudflare Pages (branch alias main)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4.114.0 pages deploy dist \
            --project-name=everydashcam \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-dirty=false

      - name: Verify published portable files and metadata
        env:
          PORTABLE_ALLOW_DEV: "1"
          PORTABLE_SMOKE_ORIGIN: https://beta.everydashcam.app
        run: node scripts/smoke-portable-downloads.mjs
