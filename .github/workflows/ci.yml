# CI gate: type-check, lint, unit tests (vitest), and the e2e regression suite
# (playwright). The e2e job is the assertion-driven replacement for manual
# click-through testing - it builds dist/ and drives a real browser.
#
# Use Playwright's pinned Chrome for Testing for reproducible browser runs.
# It includes H.264/AAC codecs; HEVC decode remains OS-dependent.
#
# WebGL (MapLibre) runs via SwiftShader. The suite is hermetic (the tile server
# is aborted in tests/e2e/_fixtures.ts), so no external network is needed;
# Retry traces aid diagnosis; a retry-only pass still fails the job.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep the runners available for the newest commit on each branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint and formatting
        run: npm run check:ci

      # CHANGELOG.md is generated from src/changelog/entries.ts; a hand edit
      # or a skipped regeneration fails here, not inside a release asset.
      - name: Changelog freshness
        run: node scripts/generate-changelog-md.mjs --check

      # Build BEFORE the unit tests: src/csp-hash.integration.test.ts asserts
      # against dist/ artifacts and fails loudly in CI when they are absent
      # (it would otherwise silently self-skip and never gate anything).
      - name: Build
        run: npm run build
        env:
          # Browser tests intercept every map request; no real API key enters CI.
          VITE_YANDEX_TILES_API_KEY: e2e-yandex-key

      - name: Unit tests (vitest)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failed shard must not cancel coverage or diagnostics from the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps --no-shell chromium

      - name: E2E tests (playwright)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --workers=1 --reporter=list,github,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/blob-report

      - name: Upload e2e blob report (incl. flaky retries)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: ${{ runner.temp }}/blob-report/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-${{ matrix.shard }}
          path: tests/e2e/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  # The default headless project may skip detection when no adapter exists.
  # Metal supports the packaged FP16 models. Linux Chromium rejects Lavapipe's
  # external-image interop and falls back to SwiftShader without shader-f16.
  # The dedicated project fails if either WebGPU or shader-f16 is unavailable.
  detectors:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps --no-shell chromium

      - name: Required detector coverage
        run: npm run test:e2e -- --project=detectors-webgpu --workers=1 --retries=0 --reporter=list,github,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/blob-report

      - name: Upload detector blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-detectors
          path: ${{ runner.temp }}/blob-report/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload detector failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detector-test-results
          path: tests/test-results/detectors/
          retention-days: 7
          if-no-files-found: ignore

  reports:
    if: ${{ !cancelled() && (needs.e2e.result == 'failure' || needs.detectors.result == 'failure') }}
    needs: [e2e, detectors]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download e2e blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-*
          path: ${{ runner.temp }}/blob-reports
          merge-multiple: true

      - name: Merge e2e reports
        # Normalize Linux and macOS report paths to the same test root.
        run: npx playwright merge-reports --config=tests/playwright.e2e.config.ts --reporter=html "$RUNNER_TEMP/blob-reports"
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: tests/playwright-report
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload e2e report (incl. flaky retries)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Keep one stable check name, including when an upstream job fails or skips.
  test:
    if: ${{ !cancelled() }}
    needs: [checks, e2e, detectors, portable, build-profiles]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all test jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo "::error::one or more required CI jobs did not succeed"
            exit 1
          fi

  portable:
    uses: ./.github/workflows/portable.yml
    with:
      version: dev-${{ github.sha }}
      allow-development: true
      project: '*'

  # Keep distinct build configurations, but share their checkout and npm install.
  # Each build replaces dist/ before the checks for that profile.
  build-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify source-map upload tooling
        run: node_modules/.bin/sentry-cli sourcemaps upload --help
      # Exercise instrumentation and debug-ID injection without uploading maps.
      - name: Build with hosted instrumentation
        env:
          VITE_NO_INDEX: "1"
          VITE_SENTRY_DSN: "https://public@example.invalid/1"
          SENTRY_AUTH_TOKEN: "synthetic-ci-token"
          SENTRY_ORG: "synthetic-ci"
          SENTRY_PROJECT: "synthetic-ci"
        run: npm run build
      - name: Build and test synthetic mirror profile
        env:
          DEPLOYMENT_PROFILE: mirror
          SEO_MIRROR_CONFIG: '{"origin":"https://mirror.example.test","localeSegments":["de"],"rootLocaleSegment":"de"}'
          META_CSP: "1"
          DISABLE_CLOUDFLARE_ANALYTICS: "1"
        run: |
          npm run build
          npm run test:deployment-profile
      # The standalone mirror cannot prove reciprocal links across both hosts.
      - name: Build and validate synthetic regional production pair
        run: npm run test:seo-regional
